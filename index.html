<link href="https://fonts.googleapis.com/css2?family=IBM&#43;Plex&#43;Sans&#43;Arabic:wght@400;500;600;700&amp;family=Readex&#43;Pro:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F5F5; --surface:#FFFFFF; --ink:#13232A; --muted:#5D6E75; --line:#DCE4E6;
  --accent:#0B5868; --accent-soft:#E2EFF1; --accent-ink:#FFFFFF;
  --good:#1D7F55; --good-soft:#E3F3EB; --warn:#9A6512; --warn-soft:#FBF0DC; --bad:#B8401A; --bad-soft:#FBE7DF;
  --fd:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif; --fb:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0E171A; --surface:#152227; --ink:#E4ECEE; --muted:#93A6AD; --line:#26363C;
  --accent:#4FB3C4; --accent-soft:#173840; --accent-ink:#06191D;
  --good:#5BC994; --good-soft:#143326; --warn:#E3B05A; --warn-soft:#3A2C12; --bad:#F08A63; --bad-soft:#3D1F15; color-scheme:dark;}}
*{box-sizing:border-box} html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:15px;line-height:1.55}
h1,h2,h3{font-family:var(--fd);margin:0;text-wrap:balance} h1{font-size:19px} h2{font-size:17px}
.num{font-variant-numeric:tabular-nums}
header{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.hin{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{display:flex;gap:10px;align-items:center;margin-inline-end:auto}
.mark{width:32px;height:32px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.brand small{display:block;color:var(--muted);font-size:12px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{font:inherit;font-weight:600;font-size:14px;padding:7px 12px;border-radius:8px;border:0;background:transparent;color:var(--muted);cursor:pointer}
nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
main{max-width:1100px;margin:0 auto;padding:18px 16px 70px;display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.ch{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.muted{color:var(--muted)} .small{font-size:13px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted)}
label.f>input,label.f>select,label.f>textarea{display:block;margin-top:5px}
.req{color:var(--bad)}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
textarea{min-height:80px;resize:vertical}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{font:inherit;font-weight:600;font-size:15px;border-radius:10px;padding:11px 18px;border:1px solid transparent;cursor:pointer;display:inline-flex;gap:8px;align-items:center;justify-content:center;text-decoration:none}
.btn.p{background:var(--accent);color:var(--accent-ink)} .btn.g{background:transparent;color:var(--accent);border-color:var(--line)}
.btn.d{background:transparent;color:var(--bad);border-color:var(--bad-soft)} .btn.sm{padding:6px 11px;font-size:13px}
.btn:disabled{opacity:.55;cursor:default}
.big{width:100%;padding:26px 18px;font-size:21px;font-family:var(--fd);border-radius:16px;background:var(--accent);color:var(--accent-ink);border:0;cursor:pointer;display:grid;gap:4px;place-items:center;box-shadow:0 6px 18px rgba(11,88,104,.25)}
.big small{font-family:var(--fb);font-size:13px;font-weight:500;opacity:.85}
.big:disabled{opacity:.6}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative} .chip input{position:absolute;inset:0;opacity:0;cursor:pointer}
.chip span{display:inline-block;padding:7px 13px;border:1px solid var(--line);border-radius:999px;font-size:14px;background:var(--bg)}
.chip input:checked+span{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.banner{padding:11px 14px;border-radius:10px;font-size:14px}
.b-ok{background:var(--good-soft);color:var(--good)} .b-err{background:var(--bad-soft);color:var(--bad)} .b-info{background:var(--accent-soft);color:var(--accent)} .b-warn{background:var(--warn-soft);color:var(--warn)}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px}
.kpi .v{font-family:var(--fd);font-size:25px;font-weight:600} .kpi .l{color:var(--muted);font-size:13px}
.kpi.alert{box-shadow:inset -3px 0 0 var(--bad)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;min-width:70px} .bar i{display:block;height:100%;background:var(--accent)}
.bar.ok i{background:var(--good)} .bar.low i{background:var(--warn)}
.tw{overflow-x:auto} table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:start;color:var(--muted);font-weight:600;font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top} tr:last-child td{border-bottom:0}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pg{background:var(--good-soft);color:var(--good)} .pw{background:var(--warn-soft);color:var(--warn)} .pb{background:var(--bad-soft);color:var(--bad)} .pn{background:var(--accent-soft);color:var(--accent)}
.live{border:2px solid var(--accent);background:var(--accent-soft)}
.pulse{width:10px;height:10px;border-radius:50%;background:var(--good);display:inline-block;margin-inline-end:6px;animation:p 1.4s infinite}
@keyframes p{50%{opacity:.3}} @media (prefers-reduced-motion:reduce){.pulse{animation:none}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font:inherit;font-size:13px;font-weight:600;padding:8px 12px;border:0;background:var(--surface);color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end} .filters label.f{min-width:150px}
.two{display:grid;gap:16px;grid-template-columns:1.5fr 1fr} @media (max-width:860px){.two{grid-template-columns:1fr}}
.hb{display:grid;grid-template-columns:140px 1fr 34px;gap:10px;align-items:center;font-size:13.5px;margin-bottom:8px}
.empty{padding:24px 10px;text-align:center;color:var(--muted)}
.vlist{display:grid;gap:9px}
.vi{border:1px solid var(--line);border-radius:10px;padding:11px 13px;display:grid;gap:5px}
.vi .r1{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.vi .meta{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.loading{display:grid;place-items:center;padding:60px 10px;color:var(--muted)}

function fieldLbl(t,req){return `${esc(t)}${req?' <span class="req">*</span>':""}`;}
function chipsHtml(name,arr,multi){return `<div class="chips">${arr.map((t,i)=>`<label class="chip"><input type="${multi?"checkbox":"radio"}" name="${name}" value="${esc(t)}" id="${name}_${i}"><span>${esc(t)}</span></label>`).join("")}</div>`;}
function chipBlock(lbl,inner){return `<div style="display:grid;gap:6px"><span class="small muted" style="font-weight:600">${lbl}</span>${inner}</div>`;}
function visitFields(o,prods,mode){
  const M=FIELDS.modes,out=[];const on=k=>M[k]===mode;const R=mode==="req";
  FIELD_DEFS.forEach(([k,t])=>{if(!on(k))return;const L=fieldLbl(t,R);
    if(k==="contact")out.push(`<label class="f" for="contact">${L}<input id="contact" autocomplete="off" placeholder="اسم الشخص"></label>`);
    else if(k==="phone")out.push(`<label class="f" for="phone">${L}<input id="phone" dir="ltr" inputmode="email" autocomplete="off" placeholder="05xxxxxxxx أو name@mail.com"></label>`);
    else if(k==="products"){if(prods.length)out.push(chipBlock(L,chipsHtml("prod",prods,true)));}
    else if(k==="role")out.push(`<label class="f" for="role">${L}<select id="role">${opts(LISTS.roles,"اختر…")}</select></label>`);
    else if(k==="clientType")out.push(`<label class="f" for="clientType">${L}<select id="clientType">${opts(LISTS.clientTypes,"اختر…")}</select></label>`);
    else if(k==="city")out.push(`<label class="f" for="city">${L}<input id="city" list="cities" value="${esc(guessCity(o.address))}"><datalist id="cities">${LISTS.cities.map(c=>`<option value="${esc(c)}">`).join("")}</datalist></label>`);
    else if(k==="value")out.push(`<label class="f" for="value">${L}<input id="value" type="number" min="0" step="500" inputmode="numeric"></label>`);
    else if(k==="next")out.push(`<label class="f" for="next">${L}<input id="next" placeholder="مثال: إرسال عرض سعر"></label>`);
    else if(k==="followUp")out.push(`<label class="f" for="followUp">${L}<input id="followUp" type="date" min="${today()}"></label>`);
    else if(k==="notes")out.push(`<label class="f" for="notes">${L}<textarea id="notes" rows="2" placeholder="أي حاجة مهمة حصلت في الزيارة…"></textarea></label>`);
  });
  (FIELDS.custom||[]).forEach(c=>{if(c.mode!==mode)return;const L=fieldLbl(c.label,R),id="x_"+c.id;
    if(c.type==="choice"||c.type==="multi")out.push(chipBlock(L,chipsHtml(id,c.options||[],c.type==="multi")));
    else if(c.type==="yesno")out.push(chipBlock(L,chipsHtml(id,["نعم","لا"],false)));
    else out.push(`<label class="f" for="${id}">${L}<input id="${id}" ${c.type==="number"?'type="number" inputmode="decimal"':c.type==="date"?'type="date"':""}></label>`);
  });
  return out.join("\n");
}
function readCustom(ff){const ex={};(FIELDS.custom||[]).forEach(c=>{const id="x_"+c.id;
  if(["choice","multi","yesno"].includes(c.type)){const v=[...ff.querySelectorAll(`input[name="${id}"]:checked`)].map(x=>x.value);ex[c.id]=c.type==="multi"?v:(v[0]||"");}
  else{const el=document.getElementById(id);ex[c.id]=el?el.value.trim():"";}});return ex;}

     ${p.note?`<div class="small muted">📝 ${esc(p.note)}</div>`:""}</button>`).join("")}</div>
   <div class="small muted" style="margin-top:8px">دوس على العميل وهو هيتكتب فوق، وبعدين دوس "وصلت" لما توصل.</div></section>`;}

function getGPS(){return new Promise(res=>{
  if(!navigator.geolocation) return res({err:"الموبايل مش بيدعم تحديد الموقع"});
  navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy}),
    e=>res({err:e.code===1?"لازم تسمح بالوصول للموقع (Location) من إعدادات المتصفح":"مقدرناش نحدد الموقع — اتأكد إن الـ GPS شغّال"}),
    {enableHighAccuracy:true,timeout:20000,maximumAge:0});
});}

function weekStart(){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-d.getDay());return d.getTime();}
function range(){const n=new Date();n.setHours(0,0,0,0);const p=S.f.period;
  if(p==="today")return n.getTime(); if(p==="week")return weekStart(); if(p==="month")return new Date(n.getFullYear(),n.getMonth(),1).getTime(); return 0;}
function subtree(root){const R=S.dash.reps;if(!root)return R.map(r=>r.id);const out=[root];for(let i=0;i<out.length;i++)R.forEach(r=>{if(r.manager===out[i]&&!out.includes(r.id))out.push(r.id);});return out;}
function treeOrder(){const R=S.dash.reps;const out=[];const walk=(id,d)=>{R.filter(r=>r.manager===id).forEach(r=>{out.push([r,d]);walk(r.id,d+1);});};
  R.filter(r=>!r.manager||!R.some(x=>x.id===r.manager)).forEach(r=>{out.push([r,0]);walk(r.id,1);});return out;}
function normN(s){return String(s||"").trim().replace(/\s+/g," ").replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").toLowerCase();}
function analyze(vs,scope){const D=S.dash;const places={};
  vs.forEach(v=>{if(!v.client)return;const k=normN(v.client);const p=places[k]||(places[k]={name:v.client,city:v.city,n:0,last:0,reps:new Set(),map:""});p.n++;p.reps.add(v.rep);if(v.ts>p.last){p.last=v.ts;p.map=v.map||p.map;p.city=v.city||p.city;}});
  const top=Object.values(places).sort((a,b)=>b.n-a.n||b.last-a.last).slice(0,12);
  const lastBy={};D.visits.forEach(v=>{if(!v.client)return;const k=normN(v.client);if(!lastBy[k]||v.ts>lastBy[k].ts)lastBy[k]=v;});
  const now=Date.now(),lim=D.staleDays*864e5,seen={},stale=[];
  (D.clients||[]).forEach(c=>{if(c.rep&&!scope.includes(c.rep))return;const k=normN(c.name);seen[k]=1;const l=lastBy[k];const lc=(c.every||D.staleDays)*864e5;
    if(!l||now-l.ts>lc)stale.push({name:c.name,city:c.city||(l&&l.city)||"",last:l?l.ts:0,rep:l?l.rep:"",days:l?Math.floor((now-l.ts)/864e5):null,src:"قائمة العملاء"});});
  Object.entries(lastBy).forEach(([k,l])=>{if(seen[k]||!scope.includes(l.repId))return;if(now-l.ts>lim)stale.push({name:l.client,city:l.city,last:l.ts,rep:l.rep,days:Math.floor((now-l.ts)/864e5),src:"زيارات سابقة"});});
  stale.sort((a,b)=>(b.days??1e9)-(a.days??1e9));return{top,stale};}

  const ds=$("#dSel");if(ds)ds.onchange=()=>{S.dept=ds.value;store.set("mdept",ds.value);S.dash=S.dashRaw;S.plan&&(S.plan=S.plan);render();};
  if(mf) mf.onsubmit=async e=>{e.preventDefault();const pin=$("#mPin").value.trim();const er=$("#mErr");er.hidden=true;const b=$("#mBtn");b.disabled=true;
    try{S.dash=await call("apiDashboard",pin);S.mgrPin=pin;store.set("mgr",pin);render();}catch(ex){er.textContent=ex.message;er.hidden=false;b.disabled=false;}};
  document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{S.f.period=b.dataset.p;render();});
  const r=$("#fRep");if(r)r.onchange=()=>{S.f.rep=r.value;render();};
  const tm=$("#fTeam");if(tm)tm.onchange=()=>{S.f.team=tm.value;S.f.rep="";render();};
  document.querySelectorAll("[data-team]").forEach(b=>b.onclick=()=>{S.f.team=S.f.team===b.dataset.team?"":b.dataset.team;S.f.rep="";render();window.scrollTo(0,0);});
  document.querySelectorAll("[data-mtab]").forEach(b=>b.onclick=()=>{if(S.mtab==="settings"&&S.cfgDirty&&b.dataset.mtab!=="settings"&&!confirmLeave(b))return;S.mtab=b.dataset.mtab;S.edit=null;if(S.mtab==="plan")S.plan=null;if(S.mtab==="clients")S.cl=null;render();});
  if(S.mtab==="clients"){
    if(!S.cl&&!S.clLoading){S.clLoading=true;call("apiClients",S.mgrPin).then(r=>{S.cl=r;S.clLoading=false;render();}).catch(ex=>{S.clLoading=false;toast(ex.message);});}
    const q=$("#clQ");if(q){q.oninput=()=>{clearTimeout(S.clT);S.clT=setTimeout(()=>{S.clq=q.value;S.clN=60;render();const n=$("#clQ");if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length);}},300);};}
    const c=$("#clC");if(c)c.onchange=()=>{S.clc=c.value;render();};const so=$("#clS");if(so)so.onchange=()=>{S.cls=so.value;render();};
    const m=$("#clMore");if(m)m.onclick=()=>{S.clN=(S.clN||60)+60;render();};
  }
  if(S.mtab==="plan"){
    if(!S.pw)S.pw=ymd(weekStart());
    const loadP=async(fn,...a)=>{try{S.plan=await call(fn,S.mgrPin,...a);render();return S.plan;}catch(ex){toast(ex.message);}};
    if((!S.plan||S.plan.week!==S.pw)&&!S.plLoading){S.plLoading=true;loadP("apiPlan",S.pw).finally(()=>{S.plLoading=false;});}
    document.querySelectorAll("[data-pw]").forEach(b=>b.onclick=()=>{S.pw=addDays(S.pw,+b.dataset.pw);render();});
    document.querySelectorAll("[data-pfs]").forEach(b=>b.onclick=()=>{S.pfs=b.dataset.pfs;render();});
    const dec=(id,ok)=>async b=>{const n=($("#mn_"+id)||{}).value||"";if(!ok&&!n.trim()){toast("اكتب سبب الرجوع في الملاحظة");return;}b.disabled=true;const r=await loadP("apiPlanDecideMgr",id,S.pw,ok,n);if(r)toast(ok?"اتعتمدت ✓":"اترجعت للتعديل");else b.disabled=false;};
    document.querySelectorAll("[data-mok]").forEach(b=>b.onclick=()=>dec(b.dataset.mok,true)(b));
    document.querySelectorAll("[data-mno]").forEach(b=>b.onclick=()=>dec(b.dataset.mno,false)(b));
  }
  if(S.mtab==="settings"&&!S.cfg&&!S.cfgLoading){S.cfgLoading=true;call("apiGetSettings",S.mgrPin).then(c=>{S.cfg=c;S.cfgLoading=false;render();}).catch(ex=>{S.cfgLoading=false;toast(ex.message);});}
  if(S.mtab==="settings"&&S.cfg){
    const dirty=()=>{S.cfgDirty=true;const m=$("#cfgMsg");if(m)m.textContent="فيه تعديلات لسه ما اتحفظتش";};
    ["sApp","sTarget","sStale","sPin","sNotify","sArr","sFin","sDig","sTest"].forEach(id=>{const el=$("#"+id);if(el)el.addEventListener("input",dirty);if(el)el.addEventListener("change",dirty);});
    const cl=$("#clrV");if(cl)cl.onclick=async()=>{if(cl.dataset.a!=="1"){cl.dataset.a="1";cl.textContent="⚠️ متأكد؟ اضغط تاني للمسح";return;}
      cl.disabled=true;try{const n=await call("apiClearVisits",S.mgrPin);S.dash=await call("apiDashboard",S.mgrPin);toast(`اتمسحت ${n} زيارة`);cl.textContent="تم المسح ✓";}catch(ex){toast(ex.message);cl.disabled=false;}};
    document.querySelectorAll("[data-msel]").forEach(el=>el.onchange=()=>{const id=el.dataset.msel;if(id.startsWith("fm_"))S.cfg.fields.modes[id.slice(3)]=el.value;else S.cfg.fields.custom[+id.slice(3)].mode=el.value;dirty();});
    document.querySelectorAll("[data-cfo]").forEach(el=>el.oninput=()=>{S.cfg.fields.custom[+el.dataset.cfo].options=el.value.split(/[,،]/).map(x=>x.trim()).filter(Boolean);dirty();});
    document.querySelectorAll("[data-cfdel]").forEach(b=>b.onclick=()=>{readGeneral();S.cfg.fields.custom.splice(+b.dataset.cfdel,1);S.cfgDirty=true;render();});
    const nt=$("#nfType");if(nt)nt.onchange=()=>{$("#nfOptsW").hidden=!["choice","multi"].includes(nt.value);};
    const na=$("#nfAdd");if(na)na.onclick=()=>{const l=$("#nfLabel").value.trim();if(!l){toast("اكتب اسم الحقل الأول");return;}const ty=nt.value;
      const op=$("#nfOpts").value.split(/[,،]/).map(x=>x.trim()).filter(Boolean);if(["choice","multi"].includes(ty)&&op.length<2){toast("اكتب اختيارين على الأقل");return;}
      readGeneral();S.cfg.fields.custom.push({id:"c"+Date.now().toString(36),label:l,type:ty,options:op,mode:$("#nfMode").value});S.cfgDirty=true;render();toast("اتضاف — متنساش تحفظ");};
    document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{readGeneral();const [k,i]=b.dataset.del.split("|");S.cfg.lists[k].splice(+i,1);S.cfgDirty=true;render();});
    document.querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>{readGeneral();const [k,i]=b.dataset.up.split("|");const a=S.cfg.lists[k];const j=+i;if(j>0)[a[j-1],a[j]]=[a[j],a[j-1]];S.cfgDirty=true;render();});
    document.querySelectorAll("[data-add]").forEach(b=>{const k=b.dataset.add;const inp=$("#add_"+k);const add=()=>{const v=inp.value.trim();if(!v)return;readGeneral();if(!S.cfg.lists[k].includes(v))S.cfg.lists[k].push(v);S.cfgDirty=true;render();const n=$("#add_"+k);if(n)n.focus();};b.onclick=add;inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();add();}};});
    const sv=$("#cfgSave");sv.onclick=async()=>{readGeneral();sv.disabled=true;$("#cfgMsg").textContent="جارِ الحفظ…";
      try{const c=await call("apiSaveSettings",S.mgrPin,S.cfg);S.mgrPin=c.managerPin;store.set("mgr",c.managerPin);S.cfg=c;S.cfgDirty=false;LISTS=c.lists;FIELDS=c.fields;S.init.appName=c.appName;$("#appName").textContent=c.appName;S.dash=await call("apiDashboard",S.mgrPin);render();toast("تم الحفظ ✓ والتطبيق اتحدّث");}
      catch(ex){$("#cfgMsg").textContent=ex.message;sv.disabled=false;}};
  }

  const ropt=()=>({person:S.rp.person,withTeam:S.rp.withTeam,from:rptRange(),to:Date.now()+864e5});
  const rpP=$("#rpPerson");if(rpP)rpP.onchange=()=>{S.rp.person=rpP.value;S.rptTo="";render();};
  document.querySelectorAll("[data-rpt]").forEach(b=>b.onclick=()=>{S.rp.withTeam=b.dataset.rpt==="1";render();});
  document.querySelectorAll("[data-rpp]").forEach(b=>b.onclick=()=>{S.rp.period=b.dataset.rpp;render();});
  const rb=$("#rptBtn");if(rb)rb.onclick=async()=>{rb.disabled=true;const m=$("#rptMsg");m.textContent="جارِ تجهيز التقرير… (ثواني)";
    try{S.rpt=await call("apiReport",S.mgrPin,ropt());m.innerHTML=`<a class="btn g" href="${esc(S.rpt.url)}" target="_blank">✓ افتح التقرير ↗</a>`;}catch(ex){m.textContent=ex.message;}rb.disabled=false;};
  const rs=$("#rptSend");if(rs)rs.onclick=async()=>{const to=$("#rptTo").value.trim();S.rptTo=to;const m=$("#rptMsg");if(!to){m.textContent="اكتب الإيميل الأول";return;}
    rs.disabled=true;m.textContent="جارِ الإرسال…";try{const r=await call("apiSendReport",S.mgrPin,ropt(),to);m.textContent="✓ اتبعت لـ "+r.sent+" إيميل";}catch(ex){m.textContent=ex.message;}rs.disabled=false;};
  const tr=document.querySelector(".tree .tn");if(tr){tr.scrollIntoView({inline:"center",block:"nearest"});window.scrollTo(0,0);}
  const ap=$("#addP");if(ap)ap.onclick=()=>{S.edit={isNew:true,p:{role:"مندوب"}};render();window.scrollTo(0,0);};
  document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{const p=S.dash.reps.find(r=>r.id===b.dataset.edit);S.edit={isNew:false,p};render();window.scrollTo(0,0);});
  const pf=$("#pf");
  if(pf){$("#pfClose").onclick=()=>{S.edit=null;render();};
    const reload=async()=>{S.dash=await call("apiDashboard",S.mgrPin);};
    pf.onsubmit=async e=>{e.preventDefault();const er=$("#pfErr");er.hidden=true;const d={name:$("#pName").value.trim(),dept:($("#pDept")||{}).value||"",role:$("#pRole").value,manager:$("#pMgr").value,position:$("#pPos").value.trim(),email:$("#pEmail").value.trim(),area:$("#pArea").value.trim()};
      if(!d.name){er.textContent="اكتب الاسم";er.hidden=false;return;}const sb=$("#pfSave");sb.disabled=true;
      try{if(S.edit.isNew){const r=await call("apiAddPerson",S.mgrPin,d);await reload();S.edit={isNew:false,p:S.dash.reps.find(x=>x.id===r.id)||d};render();$("#pfMsg").innerHTML=`<div class="banner b-ok">✓ اتضاف. الرقم السري بتاعه: <b dir="ltr">${esc(r.pin)}</b></div>`;}
        else{await call("apiUpdatePerson",S.mgrPin,S.edit.p.id,d);await reload();S.edit=null;render();toast("تم الحفظ ✓");}}
      catch(ex){er.textContent=ex.message;er.hidden=false;sb.disabled=false;}};
    const pp=$("#pfPin");if(pp)pp.onclick=async()=>{try{const p=await call("apiGetPin",S.mgrPin,S.edit.p.id);$("#pfMsg").innerHTML=`<div class="banner b-info">الرقم السري: <b dir="ltr">${esc(p)}</b></div>`;}catch(ex){toast(ex.message);}};
    const po=$("#pfOff");if(po)po.onclick=async()=>{if(po.dataset.a!=="1"){po.dataset.a="1";po.textContent="اضغط تاني للتأكيد";return;}po.disabled=true;
      try{await call("apiUpdatePerson",S.mgrPin,S.edit.p.id,{active:S.edit.p.active===false});await reload();S.edit=null;render();toast("تم ✓");}catch(ex){toast(ex.message);po.disabled=false;}};}
  const o=$("#fOut");if(o)o.onchange=()=>{S.f.outcome=o.value;render();};
  const rf=$("#refresh");if(rf)rf.onclick=async()=>{rf.disabled=true;try{S.dash=await call("apiDashboard",S.mgrPin);render();toast("تم التحديث");}catch(ex){toast(ex.message);rf.disabled=false;}};
}

{const lb=document.getElementById("langBtn");if(lb){lb.textContent=LANG==="en"?"عربي":"EN";lb.onclick=()=>{try{localStorage.setItem("lang",LANG==="en"?"ar":"en");}catch(e){}location.reload();};}}
(async()=>{
  if(false){
    $("#app").innerHTML=`<div class="card" style="max-width:520px;margin:20px auto"><h2 style="margin-bottom:8px">الملف ده مش بيشتغل لوحده</h2>
     <p class="muted" style="margin:0">لازم تفتح المنصة من رابط Apps Script اللي آخره <b dir="ltr">/exec</b> (بعد Deploy ← Web app)، مش من ملف Index.html نفسه.</p></div>`;
    return;
  }
  try{S.init=await call("apiInit");if(S.init.lists)LISTS=S.init.lists;if(S.init.fields)FIELDS=S.init.fields;if(S.init.appName){$("#appName").textContent=S.init.appName;document.title=S.init.appName+" — HMC Diagnostics";}if(S.init.logo){$("#logo").src=S.init.logo;$("#logo").style.display="block";$("#mark").style.display="none";}}catch(e){$("#app").innerHTML=`<div class="banner b-err">مقدرناش نحمّل المنصة: ${esc(e.message)}</div>`;return;}
  const saved=store.get("rep");
  if(saved){try{const st=await call("apiLogin",saved.id,saved.pin);S.rep=st.rep;S.pin=saved.pin;S.state=st;}catch(e){store.del("rep");}}
  const mp=store.get("mgr"); if(mp&&!S.rep){try{S.dash=await call("apiDashboard",mp);S.mgrPin=mp;S.view="mgr";}catch(e){store.del("mgr");}}
  render();
  setInterval(async()=>{if(S.view==="mgr"&&S.dash&&!document.hidden&&!S.edit&&S.mtab==="visits"){try{S.dash=await call("apiDashboard",S.mgrPin);render();}catch(e){}}},120000);
})();
</script>
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js");</script>
</body>
