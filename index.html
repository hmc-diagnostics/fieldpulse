<link href="https://fonts.googleapis.com/css2?family=IBM&#43;Plex&#43;Sans&#43;Arabic:wght@400;500;600;700&amp;family=Readex&#43;Pro:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F5F5; --surface:#FFFFFF; --ink:#13232A; --muted:#5D6E75; --line:#DCE4E6;
  --accent:#0B5868; --accent-soft:#E2EFF1; --accent-ink:#FFFFFF;
  --good:#1D7F55; --good-soft:#E3F3EB; --warn:#9A6512; --warn-soft:#FBF0DC; --bad:#B8401A; --bad-soft:#FBE7DF;
  --fd:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif; --fb:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0E171A; --surface:#152227; --ink:#E4ECEE; --muted:#93A6AD; --line:#26363C;
  --accent:#4FB3C4; --accent-soft:#173840; --accent-ink:#06191D;
  --good:#5BC994; --good-soft:#143326; --warn:#E3B05A; --warn-soft:#3A2C12; --bad:#F08A63; --bad-soft:#3D1F15; color-scheme:dark;}}
*{box-sizing:border-box} html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:15px;line-height:1.55}
h1,h2,h3{font-family:var(--fd);margin:0;text-wrap:balance} h1{font-size:19px} h2{font-size:17px}
.num{font-variant-numeric:tabular-nums}
header{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.hin{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{display:flex;gap:10px;align-items:center;margin-inline-end:auto}
.mark{width:32px;height:32px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.brand small{display:block;color:var(--muted);font-size:12px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{font:inherit;font-weight:600;font-size:14px;padding:7px 12px;border-radius:8px;border:0;background:transparent;color:var(--muted);cursor:pointer}
nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
main{max-width:1100px;margin:0 auto;padding:18px 16px 70px;display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.ch{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.muted{color:var(--muted)} .small{font-size:13px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted)}
label.f>input,label.f>select,label.f>textarea{display:block;margin-top:5px}
.req{color:var(--bad)}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
textarea{min-height:80px;resize:vertical}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{font:inherit;font-weight:600;font-size:15px;border-radius:10px;padding:11px 18px;border:1px solid transparent;cursor:pointer;display:inline-flex;gap:8px;align-items:center;justify-content:center;text-decoration:none}
.btn.p{background:var(--accent);color:var(--accent-ink)} .btn.g{background:transparent;color:var(--accent);border-color:var(--line)}
.btn.d{background:transparent;color:var(--bad);border-color:var(--bad-soft)} .btn.sm{padding:6px 11px;font-size:13px}
.btn:disabled{opacity:.55;cursor:default}
.big{width:100%;padding:26px 18px;font-size:21px;font-family:var(--fd);border-radius:16px;background:var(--accent);color:var(--accent-ink);border:0;cursor:pointer;display:grid;gap:4px;place-items:center;box-shadow:0 6px 18px rgba(11,88,104,.25)}
.big small{font-family:var(--fb);font-size:13px;font-weight:500;opacity:.85}
.big:disabled{opacity:.6}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative} .chip input{position:absolute;inset:0;opacity:0;cursor:pointer}
.chip span{display:inline-block;padding:7px 13px;border:1px solid var(--line);border-radius:999px;font-size:14px;background:var(--bg)}
.chip input:checked+span{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.banner{padding:11px 14px;border-radius:10px;font-size:14px}
.b-ok{background:var(--good-soft);color:var(--good)} .b-err{background:var(--bad-soft);color:var(--bad)} .b-info{background:var(--accent-soft);color:var(--accent)} .b-warn{background:var(--warn-soft);color:var(--warn)}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px}
.kpi .v{font-family:var(--fd);font-size:25px;font-weight:600} .kpi .l{color:var(--muted);font-size:13px}
.kpi.alert{box-shadow:inset -3px 0 0 var(--bad)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;min-width:70px} .bar i{display:block;height:100%;background:var(--accent)}
.bar.ok i{background:var(--good)} .bar.low i{background:var(--warn)}
.tw{overflow-x:auto} table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:start;color:var(--muted);font-weight:600;font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top} tr:last-child td{border-bottom:0}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pg{background:var(--good-soft);color:var(--good)} .pw{background:var(--warn-soft);color:var(--warn)} .pb{background:var(--bad-soft);color:var(--bad)} .pn{background:var(--accent-soft);color:var(--accent)}
.live{border:2px solid var(--accent);background:var(--accent-soft)}
.pulse{width:10px;height:10px;border-radius:50%;background:var(--good);display:inline-block;margin-inline-end:6px;animation:p 1.4s infinite}
@keyframes p{50%{opacity:.3}} @media (prefers-reduced-motion:reduce){.pulse{animation:none}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font:inherit;font-size:13px;font-weight:600;padding:8px 12px;border:0;background:var(--surface);color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end} .filters label.f{min-width:150px}
.two{display:grid;gap:16px;grid-template-columns:1.5fr 1fr} @media (max-width:860px){.two{grid-template-columns:1fr}}
.hb{display:grid;grid-template-columns:140px 1fr 34px;gap:10px;align-items:center;font-size:13.5px;margin-bottom:8px}
.empty{padding:24px 10px;text-align:center;color:var(--muted)}
.vlist{display:grid;gap:9px}
.vi{border:1px solid var(--line);border-radius:10px;padding:11px 13px;display:grid;gap:5px}
.vi .r1{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.vi .meta{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.loading{display:grid;place-items:center;padding:60px 10px;color:var(--muted)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
.toast.show{opacity:1}
.org{display:grid;gap:6px}
.org-row{display:block}
.org-node{font:inherit;width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 12px;cursor:pointer;display:flex;gap:10px;align-items:center;text-align:start}
.org-node:hover{border-color:var(--accent)}
.org-node.off{opacity:.55}
.org-dot{width:10px;height:10px;border-radius:50%;flex:none}
.org-txt{display:grid;flex:1;min-width:0}
.org-txt small{color:var(--muted);font-size:12px}
.org-ed{font-size:13px;opacity:.6}
.seg.mt{display:flex;width:100%}
.seg.mt button{flex:1 1 22%;padding:11px 6px;font-size:14px;white-space:nowrap}
.seg button:disabled{opacity:.4;cursor:default}
main>*{min-width:0}
.tree-hint{display:none;margin-bottom:6px}@media (max-width:600px){.tree-hint{display:block}}
.tree-wrap{max-width:100%;overflow-x:auto;padding:4px 0 10px;-webkit-overflow-scrolling:touch}
.tree{display:inline-block;min-width:100%}
.tree ul{position:relative;display:flex;justify-content:center;margin:0;padding:20px 0 0}
.tree>ul{padding-top:0}
.tree li{list-style:none;position:relative;padding:20px 5px 0;display:flex;flex-direction:column;align-items:center}
.tree>ul>li{padding-top:0}
.tree li::before,.tree li::after{content:"";position:absolute;top:0;width:50%;height:20px;border-top:2px solid var(--line)}
.tree li::before{left:0}
.tree li::after{right:0;border-left:2px solid var(--line)}
.tree li:first-child::after{border-top:0}
.tree li:last-child::before{border-top:0}
.tree li:only-child::before{border-top:0}
.tree>ul>li::before,.tree>ul>li::after{display:none}
.tree ul ul::before{content:"";position:absolute;top:0;left:50%;height:20px;border-left:2px solid var(--line)}
.staff{display:grid;grid-template-columns:1fr 1fr;width:100%;position:relative;padding:14px 0 0}
.staff::before{content:"";position:absolute;top:0;bottom:0;left:50%;border-left:2px solid var(--line)}
.staff.end::before{bottom:50%}
.staff .aside{grid-column:1;display:flex;align-items:center;justify-content:flex-end;gap:0}
.staff .aside .tn{border-style:dashed;border-top-style:solid}
.staff .hl{width:22px;border-top:2px dashed var(--line);flex:none}
.tn{font:inherit;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:10px;padding:9px 10px;min-width:112px;max-width:150px;display:grid;gap:3px;justify-items:center;cursor:pointer;text-align:center}
.tn:hover{box-shadow:0 3px 10px rgba(0,0,0,.08)}
.tn b{font-size:13px;line-height:1.3}.tn small{font-size:11px;color:var(--muted)}.tn .pill{font-size:10.5px}
.tn.off{opacity:.5}
.seg.wide{display:flex;width:100%}.seg.wide button{flex:1;min-width:0;white-space:normal;line-height:1.3}
.seg.mt{flex-wrap:wrap}
details.more{border:1px dashed var(--line);border-radius:10px;padding:10px 12px}
details.more summary{cursor:pointer;font-weight:600;color:var(--accent);list-style:none}
details.more summary::-webkit-details-marker{display:none}
.chips.edit{gap:6px}
.echip{display:inline-flex;align-items:center;gap:4px;padding:5px 6px 5px 6px;border:1px solid var(--line);border-radius:999px;background:var(--bg);font-size:14px}
.echip .ex,.echip .eup{font:inherit;border:0;background:transparent;cursor:pointer;color:var(--muted);width:24px;height:24px;border-radius:50%;line-height:1}
.echip .ex{color:var(--bad);font-size:18px}.echip .ex:hover{background:var(--bad-soft)}.echip .eup:hover{background:var(--accent-soft)}
.echip .eup:disabled{opacity:.25;cursor:default}
.sw{display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer}
.sw input{width:20px;height:20px;accent-color:var(--accent)}
.sw span{display:none}
.savebar{position:sticky;bottom:10px;z-index:4;display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:0 6px 18px rgba(0,0,0,.08)}
.savebar #cfgMsg{color:var(--warn)}
.frows{display:grid;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.frow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;border-top:1px solid var(--line);font-size:14px}
.frow:first-child{border-top:0}
.frow.cf>span:first-child{display:grid;gap:6px;flex:1;min-width:0}
.frow .msel{width:auto;min-width:96px;padding:6px 8px;font-size:13px}
.frow .cfo{padding:6px 8px;font-size:13px}
.big-add{width:100%;padding:14px;font-size:16px}
@media (max-width:600px){
  main{padding:12px 10px 60px;gap:12px}
  .card{padding:13px}
  .kpis{grid-template-columns:repeat(2,1fr);gap:8px}
  .kpi{padding:10px} .kpi .v{font-size:21px}
  .filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .filters .seg{grid-column:1/-1;display:flex} .filters .seg button{flex:1}
  .filters label.f{min-width:0}
  .filters .btn{width:100%}
  .hin{padding:8px 10px;gap:8px} nav{width:100%} nav button{flex:1;padding:8px 4px;font-size:13px}
  h1{font-size:17px}
  .hb{grid-template-columns:110px 1fr 28px}
  td,th{padding:7px 6px}
  .vi .meta{gap:8px}
  .tn{min-width:92px;max-width:118px;padding:7px 6px}.tn b{font-size:12px}
  .tree li{padding-left:3px;padding-right:3px}
}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><div class="hin">
  <div class="brand"><img id="logo" alt="HMC Group" style="height:38px;display:none"><div class="mark" id="mark" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.4"/></svg></div>
   <div><h1 id="appName">نبض الميدان</h1><small id="who">HMC Diagnostics</small></div></div>
  <nav id="nav"></nav>
</div></header>
<main id="app"><div class="loading">جارِ التحميل…</div></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
let LISTS={purposes:["تعريف بمنتج / جهاز جديد","متابعة عرض سعر","عرض توضيحي (Demo)","متابعة تركيب / تدريب","دعم فني / شكوى","تحصيل مستحقات","مناقصة","زيارة دورية للعميل","تسليم طلبية","أخرى"],
 outcomes:["تم الاتفاق / أمر شراء","طلب عرض سعر","مهتم — يحتاج متابعة","تم حل المشكلة","تم التحصيل","مؤجل","غير مهتم","لم يتم اللقاء"],
 clientTypes:["مستشفى حكومي","مستشفى خاص","مختبر خاص","مجمع طبي / مستوصف","عيادة","بنك دم","موزع / شريك","أخرى"],
 cities:["الرياض","جدة","مكة المكرمة","المدينة المنورة","الدمام","الخبر","الظهران","الأحساء","الجبيل","القصيم / بريدة","الطائف","أبها","خميس مشيط","تبوك","حائل","جازان","نجران","الباحة","الجوف","ينبع"],
 roles:["مدير المختبر","أخصائي مختبر","طبيب","مدير المشتريات","الإدارة","صيدلي","مهندس أجهزة طبية","أخرى"],products:[]};
const LIST_LABELS=[["purposes","أهداف الزيارة","🎯"],["outcomes","نتائج الزيارة","✅"],["products","المنتجات","📦"],["clientTypes","أنواع الجهات","🏥"],["cities","المدن","📍"],["roles","صفات المسؤول","👤"]];
let FIELDS={modes:{contact:"req",phone:"req",products:"req",role:"opt",clientType:"opt",city:"opt",value:"opt",next:"opt",followUp:"opt",notes:"opt"},custom:[]};
const FIELD_DEFS=[["contact","الشخص اللي قابلته"],["phone","رقم التواصل أو الإيميل"],["products","المنتجات اللي اتكلم عنها"],["role","صفته"],["clientType","نوع الجهة"],["city","المدينة"],["value","القيمة المتوقعة (ريال)"],["next","الخطوة الجاية"],["followUp","موعد المتابعة"],["notes","ملاحظات"]];
const FTYPES=[["text","نص"],["number","رقم"],["choice","اختيار واحد"],["multi","أكتر من اختيار"],["yesno","نعم / لا"],["date","تاريخ"]];
const isQ=o=>/عرض سعر/.test(o||"")&&!/متابعة/.test(o||"");
const isO=o=>/أمر شراء|اتفاق|تعاقد/.test(o||"");
const outCls=o=>isO(o)||/^تم /.test(o||"")?"pg":/غير|لم /.test(o||"")?"pb":/مؤجل|لاحق/.test(o||"")?"pw":"pn";

const S={init:null,rep:null,pin:null,state:null,view:"home",mgrPin:null,dash:null,f:{period:"week",rep:"",outcome:"",team:""},rpt:null,mtab:"visits",edit:null,rp:{person:"",withTeam:true,period:"month"}};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtD=ts=>new Date(ts).toLocaleDateString("ar-EG-u-nu-latn",{weekday:"short",day:"numeric",month:"short"});
const fmtT=ts=>new Date(ts).toLocaleTimeString("ar-EG-u-nu-latn",{hour:"numeric",minute:"2-digit"});
const fmtN=n=>Number(n||0).toLocaleString("en-US");
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
const store={get(k){try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}},del(k){try{localStorage.removeItem(k);}catch(e){}}};
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),2800);}
const API='https://script.google.com/macros/s/AKfycbwmPUjMauq_G8xeaAVMaNnuJIGbhmp8X70zvV2kdrGZvjCNxXHCmehD2BvMrg-81surog/exec';function call(fn,...args){return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args})}).then(r=>r.json()).then(j=>{if(!j.ok)throw new Error(String(j.error||'حصل خطأ').replace(/^Error: ?/,''));return j.data;}).catch(e=>{throw new Error(e.message==='Failed to fetch'?'مفيش اتصال بالنت — جرّب تاني':e.message);});}
const opts=(a,ph)=>(ph?`<option value="">${ph}</option>`:"")+a.map(x=>`<option>${esc(x)}</option>`).join("");

function drawNav(){
  const items=S.rep?[["home","زيارة"],["mine","زياراتي"],["mgr","لوحة المدير"]]:[["home","دخول المندوب"],["mgr","لوحة المدير"]];
  $("#nav").innerHTML=items.map(([k,t])=>`<button type="button" data-v="${k}" ${S.view===k?'aria-current="page"':""}>${t}</button>`).join("");
  $("#nav").querySelectorAll("button").forEach(b=>b.onclick=()=>{S.view=b.dataset.v;render();});
  $("#who").textContent=S.rep?S.rep.name:"HMC Diagnostics";
}
function render(){drawNav();const a=$("#app");
  if(S.view==="mgr"){a.innerHTML=S.dash?viewDash():viewMgrLogin();bindMgr();return;}
  if(!S.rep){a.innerHTML=viewLogin();bindLogin();return;}
  a.innerHTML=S.view==="mine"?viewMine():viewHome();bindRep();
}

function viewLogin(){
  const reps=(S.init&&S.init.reps)||[];
  return `<section class="card" style="max-width:460px;margin:20px auto;width:100%">
   <h2 style="margin-bottom:6px">أهلاً 👋</h2><p class="muted small" style="margin:0 0 14px">اختار اسمك واكتب الرقم السري بتاعك. هتدخل مرة واحدة بس على الموبايل ده.</p>
   <form id="lf" style="display:grid;gap:12px">
    <label class="f" for="lRep">الاسم<select id="lRep" required><option value="">اختار اسمك…</option>${reps.map(r=>`<option value="${esc(r.id)}">${esc(r.name)}</option>`).join("")}</select></label>
    <label class="f" for="lPin">الرقم السري<input id="lPin" inputmode="numeric" autocomplete="off" required dir="ltr"></label>
    <div class="banner b-err" id="lErr" hidden></div>
    <button class="btn p" type="submit" id="lBtn">دخول</button>
   </form></section>`;
}
function bindLogin(){
  $("#lf").onsubmit=async e=>{e.preventDefault();const id=$("#lRep").value,pin=$("#lPin").value.trim();const er=$("#lErr");er.hidden=true;
    if(!id||!pin){er.textContent="اختار اسمك واكتب الرقم السري";er.hidden=false;return;}
    const b=$("#lBtn");b.disabled=true;b.textContent="جارِ الدخول…";
    try{const st=await call("apiLogin",id,pin);S.rep=st.rep;S.pin=pin;S.state=st;store.set("rep",{id,pin});S.view="home";render();}
    catch(ex){er.textContent=ex.message;er.hidden=false;b.disabled=false;b.textContent="دخول";}};
}

function viewHome(){
  const st=S.state;const o=st.open;
  const pct=st.target?Math.min(100,Math.round(st.week/st.target*100)):0;
  const head=`<div class="kpis">
    <div class="kpi"><div class="v num">${st.today}</div><div class="l">زيارات النهارده</div></div>
    <div class="kpi"><div class="v num">${st.week}<span class="muted" style="font-size:14px"> / ${st.target}</span></div><div class="l">زيارات الأسبوع</div><div class="bar ${pct>=100?"ok":pct<50?"low":""}" style="margin-top:7px"><i style="width:${pct}%"></i></div></div>
    <div class="kpi ${st.followUps.some(v=>v.followUp<today())?"alert":""}"><div class="v num">${st.followUps.length}</div><div class="l">متابعات مفتوحة</div></div></div>`;
  if(!o){
    const clients=Object.keys(st.clients||{});
    return `${S.flash||""}<section class="card" style="display:grid;gap:12px">
      <label class="f" for="cName">اسم العميل (اختياري — تقدر تكتبه بعدين)<input id="cName" list="cl" placeholder="مثال: مستشفى الحبيب – العليا"><datalist id="cl">${clients.map(c=>`<option value="${esc(c)}">`).join("")}</datalist></label>
      <button class="big" id="arrive" type="button">📍 وصلت عند العميل<small>هيتبعت موقعك تلقائي للإدارة</small></button>
      <div id="gpsMsg" class="small muted" style="text-align:center"></div>
    </section>${head}`;
  }
  const prods=st.products||[];const cInfo=(st.clients||{})[o.client]||{};
  return `<section class="card live">
     <div class="ch" style="margin-bottom:4px"><h2><span class="pulse"></span>زيارة جارية</h2><span class="small num">من ${fmtT(o.ts)}</span></div>
     <div class="small">${o.map?`📍 ${esc(o.address||"تم تحديد الموقع")} · <a href="${esc(o.map)}" target="_blank">الخريطة</a>`:`<span style="color:var(--bad)">⚠️ بدون لوكيشن</span>`}</div>
   </section>
   <section class="card"><h2 style="margin-bottom:12px">تفاصيل الزيارة</h2>
   <form id="ff" style="display:grid;gap:16px" novalidate>
    <label class="f" for="client">اسم العميل <span class="req">*</span><input id="client" list="cl2" value="${esc(o.client||"")}" placeholder="المستشفى / المختبر"><datalist id="cl2">${Object.keys(st.clients||{}).map(c=>`<option value="${esc(c)}">`).join("")}</datalist></label>
    <div style="display:grid;gap:6px"><span class="small muted" style="font-weight:600">هدف الزيارة <span class="req">*</span></span>
     <div class="chips">${LISTS.purposes.map((t,i)=>`<label class="chip"><input type="radio" name="purp" value="${esc(t)}" id="u${i}"><span>${esc(t)}</span></label>`).join("")}</div></div>
    <div style="display:grid;gap:6px"><span class="small muted" style="font-weight:600">النتيجة <span class="req">*</span></span>
     <div class="chips">${LISTS.outcomes.map((t,i)=>`<label class="chip"><input type="radio" name="out" value="${esc(t)}" id="o${i}"><span>${esc(t)}</span></label>`).join("")}</div></div>
    ${visitFields(o,prods,"req")}
    ${(()=>{const h=visitFields(o,prods,"opt");return h.trim()?`<details class="more"><summary>➕ تفاصيل إضافية <span class="muted small">(اختياري)</span></summary><div style="display:grid;gap:14px;margin-top:12px">${h}</div></details>`:"";})()}
    <div class="banner b-err" id="fErr" hidden></div>
    <button class="btn p" type="submit" id="fBtn" style="padding:15px;font-size:16px">✅ إنهاء الزيارة وإرسالها</button>
    <button class="btn d sm" type="button" id="cancelV" style="justify-self:center">إلغاء الزيارة</button>
   </form></section>`;
}

function fieldLbl(t,req){return `${esc(t)}${req?' <span class="req">*</span>':""}`;}
function chipsHtml(name,arr,multi){return `<div class="chips">${arr.map((t,i)=>`<label class="chip"><input type="${multi?"checkbox":"radio"}" name="${name}" value="${esc(t)}" id="${name}_${i}"><span>${esc(t)}</span></label>`).join("")}</div>`;}
function chipBlock(lbl,inner){return `<div style="display:grid;gap:6px"><span class="small muted" style="font-weight:600">${lbl}</span>${inner}</div>`;}
function visitFields(o,prods,mode){
  const M=FIELDS.modes,out=[];const on=k=>M[k]===mode;const R=mode==="req";
  FIELD_DEFS.forEach(([k,t])=>{if(!on(k))return;const L=fieldLbl(t,R);
    if(k==="contact")out.push(`<label class="f" for="contact">${L}<input id="contact" autocomplete="off" placeholder="اسم الشخص"></label>`);
    else if(k==="phone")out.push(`<label class="f" for="phone">${L}<input id="phone" dir="ltr" inputmode="email" autocomplete="off" placeholder="05xxxxxxxx أو name@mail.com"></label>`);
    else if(k==="products"){if(prods.length)out.push(chipBlock(L,chipsHtml("prod",prods,true)));}
    else if(k==="role")out.push(`<label class="f" for="role">${L}<select id="role">${opts(LISTS.roles,"اختر…")}</select></label>`);
    else if(k==="clientType")out.push(`<label class="f" for="clientType">${L}<select id="clientType">${opts(LISTS.clientTypes,"اختر…")}</select></label>`);
    else if(k==="city")out.push(`<label class="f" for="city">${L}<input id="city" list="cities" value="${esc(guessCity(o.address))}"><datalist id="cities">${LISTS.cities.map(c=>`<option value="${esc(c)}">`).join("")}</datalist></label>`);
    else if(k==="value")out.push(`<label class="f" for="value">${L}<input id="value" type="number" min="0" step="500" inputmode="numeric"></label>`);
    else if(k==="next")out.push(`<label class="f" for="next">${L}<input id="next" placeholder="مثال: إرسال عرض سعر"></label>`);
    else if(k==="followUp")out.push(`<label class="f" for="followUp">${L}<input id="followUp" type="date" min="${today()}"></label>`);
    else if(k==="notes")out.push(`<label class="f" for="notes">${L}<textarea id="notes" rows="2" placeholder="أي حاجة مهمة حصلت في الزيارة…"></textarea></label>`);
  });
  (FIELDS.custom||[]).forEach(c=>{if(c.mode!==mode)return;const L=fieldLbl(c.label,R),id="x_"+c.id;
    if(c.type==="choice"||c.type==="multi")out.push(chipBlock(L,chipsHtml(id,c.options||[],c.type==="multi")));
    else if(c.type==="yesno")out.push(chipBlock(L,chipsHtml(id,["نعم","لا"],false)));
    else out.push(`<label class="f" for="${id}">${L}<input id="${id}" ${c.type==="number"?'type="number" inputmode="decimal"':c.type==="date"?'type="date"':""}></label>`);
  });
  return out.join("\n");
}
function readCustom(ff){const ex={};(FIELDS.custom||[]).forEach(c=>{const id="x_"+c.id;
  if(["choice","multi","yesno"].includes(c.type)){const v=[...ff.querySelectorAll(`input[name="${id}"]:checked`)].map(x=>x.value);ex[c.id]=c.type==="multi"?v:(v[0]||"");}
  else{const el=document.getElementById(id);ex[c.id]=el?el.value.trim():"";}});return ex;}
function guessCity(a){a=String(a||"");return LISTS.cities.find(c=>c.split("/").some(p=>p.trim()&&a.includes(p.trim())))||"";}
function viewMine(){
  const st=S.state;const fu=st.followUps;
  return `${fu.length?`<section class="card"><h2 style="margin-bottom:10px">المتابعات المطلوبة</h2><div class="tw"><table><tbody>
    ${fu.map(v=>`<tr><td class="num"><span class="pill ${v.followUp<today()?"pb":v.followUp===today()?"pw":"pn"}">${esc(v.followUp)}</span></td><td>${esc(v.client)}<div class="small muted">${esc(v.next||"")}</div></td><td><button class="btn g sm" data-done="${esc(v.id)}">تمت</button></td></tr>`).join("")}
   </tbody></table></div></section>`:""}

function getGPS(){return new Promise(res=>{
  if(!navigator.geolocation) return res({err:"الموبايل مش بيدعم تحديد الموقع"});
  navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy}),
    e=>res({err:e.code===1?"لازم تسمح بالوصول للموقع (Location) من إعدادات المتصفح":"مقدرناش نحدد الموقع — اتأكد إن الـ GPS شغّال"}),
    {enableHighAccuracy:true,timeout:20000,maximumAge:0});
});}

      products:prodSel,outcome:out,value:val("value"),next:val("next"),followUp:val("followUp"),notes:val("notes"),extra:ex};

function weekStart(){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-d.getDay());return d.getTime();}
function range(){const n=new Date();n.setHours(0,0,0,0);const p=S.f.period;
  if(p==="today")return n.getTime(); if(p==="week")return weekStart(); if(p==="month")return new Date(n.getFullYear(),n.getMonth(),1).getTime(); return 0;}
function subtree(root){const R=S.dash.reps;if(!root)return R.map(r=>r.id);const out=[root];for(let i=0;i<out.length;i++)R.forEach(r=>{if(r.manager===out[i]&&!out.includes(r.id))out.push(r.id);});return out;}
function treeOrder(){const R=S.dash.reps;const out=[];const walk=(id,d)=>{R.filter(r=>r.manager===id).forEach(r=>{out.push([r,d]);walk(r.id,d+1);});};
  R.filter(r=>!r.manager||!R.some(x=>x.id===r.manager)).forEach(r=>{out.push([r,0]);walk(r.id,1);});return out;}
function normN(s){return String(s||"").trim().replace(/\s+/g," ").replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").toLowerCase();}
function analyze(vs,scope){const D=S.dash;const places={};
  vs.forEach(v=>{if(!v.client)return;const k=normN(v.client);const p=places[k]||(places[k]={name:v.client,city:v.city,n:0,last:0,reps:new Set(),map:""});p.n++;p.reps.add(v.rep);if(v.ts>p.last){p.last=v.ts;p.map=v.map||p.map;p.city=v.city||p.city;}});
  const top=Object.values(places).sort((a,b)=>b.n-a.n||b.last-a.last).slice(0,12);
  const lastBy={};D.visits.forEach(v=>{if(!v.client)return;const k=normN(v.client);if(!lastBy[k]||v.ts>lastBy[k].ts)lastBy[k]=v;});
  const now=Date.now(),lim=D.staleDays*864e5,seen={},stale=[];
  (D.clients||[]).forEach(c=>{if(c.rep&&!scope.includes(c.rep))return;const k=normN(c.name);seen[k]=1;const l=lastBy[k];const lc=(c.every||D.staleDays)*864e5;
    if(!l||now-l.ts>lc)stale.push({name:c.name,city:c.city||(l&&l.city)||"",last:l?l.ts:0,rep:l?l.rep:"",days:l?Math.floor((now-l.ts)/864e5):null,src:"قائمة العملاء"});});
  Object.entries(lastBy).forEach(([k,l])=>{if(seen[k]||!scope.includes(l.repId))return;if(now-l.ts>lim)stale.push({name:l.client,city:l.city,last:l.ts,rep:l.rep,days:Math.floor((now-l.ts)/864e5),src:"زيارات سابقة"});});
  stale.sort((a,b)=>(b.days??1e9)-(a.days??1e9));return{top,stale};}

    <label class="f" for="pMgr">تابع لـ<select id="pMgr"><option value="">— بدون —</option>${others.map(r=>`<option value="${esc(r.id)}" ${r.id===(p.manager||"")?"selected":""}>${esc(r.name)}</option>`).join("")}</select></label>
    <label class="f" for="pPos">المسمى الوظيفي<input id="pPos" value="${esc(p.position||"")}"></label>
    <label class="f" for="pEmail">الإيميل<input id="pEmail" type="email" dir="ltr" value="${esc(p.email||"")}"></label>
    <label class="f" for="pArea">المنطقة<input id="pArea" value="${esc(p.area||"")}"></label>
   </div>
   <div class="banner b-err" id="pfErr" hidden></div>
   <div class="row"><button class="btn p" type="submit" id="pfSave" style="flex:1">${isNew?"إضافة":"حفظ التعديلات"}</button>
    ${isNew?"":`<button class="btn g" type="button" id="pfPin">🔑 الرقم السري</button><button class="btn d" type="button" id="pfOff">${p.active===false?"تفعيل":"إيقاف"}</button>`}</div>
   <div id="pfMsg" class="small"></div></form>`;}
function treeHTML(sub){const R=S.dash.reps.filter(r=>!r.vacant);const cols=["#0B5868","#C9A227","#3B6EA8","#1D7F55","#7A5BA8","#B8401A"];
  const isSide=x=>/منسق|مساعد|سكرتير/.test(x.role||"");
  const btn=(r,d)=>`<button type="button" class="tn ${r.active?"":"off"}" data-edit="${esc(r.id)}" style="border-top-color:${cols[d%6]}"><b>${esc(r.name)}</b><small>${esc(r.role||r.position||"")}${r.active?"":" · موقوف"}</small><span class="pill pn num">${sub(r.id)} زيارة</span></button>`;
  const node=(r,d)=>{const all=R.filter(x=>x.manager===r.id);const side=all.filter(isSide),kids=all.filter(x=>!isSide(x));
    return `<li>${btn(r,d)}${side.length?`<div class="staff${kids.length?"":" end"}"><div class="aside">${side.map(x=>btn(x,d+1)).join("")}<span class="hl"></span></div></div>`:""}${kids.length?`<ul>${kids.map(k=>node(k,d+1)).join("")}</ul>`:""}</li>`;};
  const roots=R.filter(r=>!r.manager||!R.some(x=>x.id===r.manager));
  return `<ul>${roots.map(r=>node(r,0)).join("")}</ul>`;}
function viewTeam(){const D=S.dash;const cnt={};const from=range();D.visits.filter(v=>v.ts>=from).forEach(v=>cnt[v.repId]=(cnt[v.repId]||0)+1);
  const sub=id=>subtree(id).reduce((s,x)=>s+(cnt[x]||0),0);
  return `${S.edit?personForm(S.edit.p,S.edit.isNew):`<button class="btn p big-add" type="button" id="addP">➕ إضافة شخص جديد</button>`}
   <section class="card"><div class="ch"><h2>الهيكل التنظيمي</h2><span class="small muted">اضغط على أي اسم للتعديل · الرقم = زيارات الفريق ${({today:"النهارده",week:"الأسبوع ده",month:"الشهر ده",all:"الكل"})[S.f.period]}</span></div>
    <div class="small muted tree-hint">↔ اسحب يمين وشمال لو الهيكل عريض</div><div class="tree-wrap"><div class="tree">${treeHTML(sub)}</div></div>
   </section>`;}
function viewReports(){const D=S.dash,R=S.rp;const people=treeOrder().filter(([r])=>!r.vacant&&r.active);
  const sel=D.reps.find(r=>r.id===R.person);const hasTeam=sel&&D.reps.some(x=>x.manager===sel.id&&x.active);
  return `<section class="card" style="display:grid;gap:14px">
   <h2>تقرير PDF</h2>
   <label class="f" for="rpPerson">التقرير لمين؟<select id="rpPerson"><option value="">القسم كله</option>${people.map(([r,d])=>`<option value="${esc(r.id)}" ${R.person===r.id?"selected":""}>${"  ".repeat(d)}${esc(r.name)}${r.role?" — "+esc(r.role):""}</option>`).join("")}</select></label>
   ${sel?`<div class="seg wide" role="group" aria-label="نطاق التقرير"><button type="button" data-rpt="0" aria-pressed="${!R.withTeam||!hasTeam}">${esc(sel.name)} لوحده</button><button type="button" data-rpt="1" aria-pressed="${R.withTeam&&hasTeam}" ${hasTeam?"":"disabled"}>${esc(sel.name)} + فريقه</button></div>`:""}
   <div><span class="small muted" style="font-weight:600">الفترة</span><div class="seg wide" style="margin-top:6px">${[["week","الأسبوع"],["month","الشهر"],["quarter","3 شهور"],["all","الكل"]].map(([k,x])=>`<button type="button" data-rpp="${k}" aria-pressed="${R.period===k}">${x}</button>`).join("")}</div></div>
   <button class="btn p" id="rptBtn" type="button" style="padding:14px">📄 طلّع التقرير</button>
   <div class="row"><input id="rptTo" type="email" dir="ltr" placeholder="إيميل (أو أكتر بفاصلة)" style="flex:1;min-width:200px" value="${esc(S.rptTo||(sel&&sel.email)||"")}"><button class="btn g" id="rptSend" type="button">📧 ابعته</button></div>
   <div class="small" id="rptMsg">${S.rpt?`<a href="${esc(S.rpt.url)}" target="_blank">✓ فتح آخر تقرير ↗</a>`:""}</div>
  </section>`;}
function viewSettings(){const C=S.cfg;
  if(!C)return `<div class="card loading">جارِ تحميل الإعدادات…</div>`;
  return `<section class="card" style="display:grid;gap:12px"><h2>⚙️ عام</h2>
   <div class="grid">
    <label class="f" for="sApp">اسم المنصة<input id="sApp" value="${esc(C.appName)}"></label>
    <label class="f" for="sTarget">تارجت الزيارات في الأسبوع (لكل مندوب)<input id="sTarget" type="number" min="1" inputmode="numeric" value="${C.target}"></label>
    <label class="f" for="sStale">العميل "محتاج زيارة" بعد (يوم)<input id="sStale" type="number" min="1" inputmode="numeric" value="${C.staleDays}"></label>
    <label class="f" for="sPin">الرقم السري للوحة المدير<input id="sPin" inputmode="numeric" dir="ltr" value="${esc(C.managerPin)}"></label>
   </div>
   <label class="f" for="sNotify">الإيميلات اللي يوصلها إشعار الزيارات (افصل بفاصلة)<input id="sNotify" dir="ltr" value="${esc(C.notify)}"></label>
   <label class="sw"><input type="checkbox" id="sArr" ${C.mailOnArrive?"checked":""}><span></span> إيميل لما المندوب يوصل عند العميل</label>
   <label class="sw"><input type="checkbox" id="sFin" ${C.mailOnFinish?"checked":""}><span></span> إيميل لما المندوب ينهي الزيارة</label>
  </section>
  <section class="card" style="display:grid;gap:10px"><div class="ch"><h2>📋 متطلبات الزيارة</h2><span class="small muted">اللي المندوب لازم يملاه</span></div>
   <div class="small muted">اسم العميل، هدف الزيارة، والنتيجة إجباري دايمًا.</div>
   <div class="frows">${FIELD_DEFS.map(([k,t])=>`<div class="frow"><span>${esc(t)}</span>${modeSel("fm_"+k,C.fields.modes[k],true)}</div>`).join("")}</div>
   <h3 style="margin:8px 0 0;font-size:15px">➕ حقول إضافية خاصة بيك</h3>
   ${(C.fields.custom||[]).length?`<div class="frows">${C.fields.custom.map((c,i)=>`<div class="frow cf"><span><b>${esc(c.label)}</b> <span class="small muted">· ${esc((FTYPES.find(x=>x[0]===c.type)||[,""])[1])}</span>
      ${["choice","multi"].includes(c.type)?`<input class="cfo" data-cfo="${i}" value="${esc((c.options||[]).join("، "))}" placeholder="الاختيارات مفصولة بفاصلة">`:""}</span>
      <span class="row" style="gap:6px;flex-wrap:nowrap">${modeSel("cm_"+i,c.mode,false)}<button type="button" class="btn d sm" data-cfdel="${i}" aria-label="حذف ${esc(c.label)}">×</button></span></div>`).join("")}</div>`:`<div class="small muted">مفيش حقول إضافية لسه — زوّد اللي محتاجه تحت.</div>`}
   <div class="grid" style="align-items:end">
    <label class="f" for="nfLabel">اسم الحقل<input id="nfLabel" placeholder="مثال: عدد الأجهزة عند العميل"></label>
    <label class="f" for="nfType">نوعه<select id="nfType">${FTYPES.map(([v,t])=>`<option value="${v}">${t}</option>`).join("")}</select></label>
    <label class="f" for="nfMode">إجباري؟<select id="nfMode"><option value="req">إجباري</option><option value="opt">اختياري</option></select></label>
   </div>
   <label class="f" for="nfOpts" id="nfOptsW" hidden>الاختيارات (افصل بفاصلة)<input id="nfOpts" placeholder="مثال: Snibe، Mindray، Roche"></label>
   <button class="btn g" type="button" id="nfAdd" style="justify-self:start">+ إضافة الحقل</button>
  </section>
  ${LIST_LABELS.map(([k,t,ic])=>`<section class="card"><div class="ch"><h2>${ic} ${t}</h2><span class="small muted">${(C.lists[k]||[]).length} اختيار</span></div>
    <div class="chips edit">${(C.lists[k]||[]).map((x,i)=>`<span class="echip"><button type="button" class="eup" data-up="${k}|${i}" aria-label="لأعلى" ${i?"":"disabled"}>↑</button>${esc(x)}<button type="button" class="ex" data-del="${k}|${i}" aria-label="حذف ${esc(x)}">×</button></span>`).join("")}</div>
    <div class="row" style="margin-top:10px"><input id="add_${k}" placeholder="اكتب اختيار جديد…" style="flex:1;min-width:160px"><button class="btn g" type="button" data-add="${k}">+ إضافة</button></div>
   </section>`).join("")}
  <div class="savebar"><span class="small" id="cfgMsg">${S.cfgDirty?"فيه تعديلات لسه ما اتحفظتش":""}</span><button class="btn p" type="button" id="cfgSave">💾 حفظ الإعدادات</button></div>`;}
function modeSel(id,v,allowOff){return `<select id="${id}" class="msel" data-msel="${id}">${[["req","إجباري"],["opt","اختياري"]].concat(allowOff?[["off","مخفي"]]:[]).map(([k,t])=>`<option value="${k}" ${v===k?"selected":""}>${t}</option>`).join("")}</select>`;}
function readGeneral(){const C=S.cfg;if(!$("#sApp"))return;C.appName=$("#sApp").value.trim()||C.appName;C.target=+$("#sTarget").value||C.target;C.staleDays=+$("#sStale").value||C.staleDays;C.managerPin=$("#sPin").value.trim()||C.managerPin;C.notify=$("#sNotify").value.trim();C.mailOnArrive=$("#sArr").checked;C.mailOnFinish=$("#sFin").checked;}
function rptRange(){const p=S.rp.period;const n=new Date();n.setHours(0,0,0,0);
  if(p==="week")return weekStart(); if(p==="month")return new Date(n.getFullYear(),n.getMonth(),1).getTime(); if(p==="quarter")return n.getTime()-90*864e5; return 0;}
function confirmLeave(b){if(b.dataset.leave==="1")return true;b.dataset.leave="1";toast("فيه تعديلات ما اتحفظتش — اضغط تاني للخروج من غير حفظ");return false;}
function bindMgr(){
  const mf=$("#mf");
  if(mf) mf.onsubmit=async e=>{e.preventDefault();const pin=$("#mPin").value.trim();const er=$("#mErr");er.hidden=true;const b=$("#mBtn");b.disabled=true;
    try{S.dash=await call("apiDashboard",pin);S.mgrPin=pin;store.set("mgr",pin);render();}catch(ex){er.textContent=ex.message;er.hidden=false;b.disabled=false;}};
  document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{S.f.period=b.dataset.p;render();});
  const r=$("#fRep");if(r)r.onchange=()=>{S.f.rep=r.value;render();};
  const tm=$("#fTeam");if(tm)tm.onchange=()=>{S.f.team=tm.value;S.f.rep="";render();};
  document.querySelectorAll("[data-team]").forEach(b=>b.onclick=()=>{S.f.team=S.f.team===b.dataset.team?"":b.dataset.team;S.f.rep="";render();window.scrollTo(0,0);});
  document.querySelectorAll("[data-mtab]").forEach(b=>b.onclick=()=>{if(S.mtab==="settings"&&S.cfgDirty&&b.dataset.mtab!=="settings"&&!confirmLeave(b))return;S.mtab=b.dataset.mtab;S.edit=null;render();});
  if(S.mtab==="settings"&&!S.cfg&&!S.cfgLoading){S.cfgLoading=true;call("apiGetSettings",S.mgrPin).then(c=>{S.cfg=c;S.cfgLoading=false;render();}).catch(ex=>{S.cfgLoading=false;toast(ex.message);});}
  if(S.mtab==="settings"&&S.cfg){
    const dirty=()=>{S.cfgDirty=true;const m=$("#cfgMsg");if(m)m.textContent="فيه تعديلات لسه ما اتحفظتش";};
    ["sApp","sTarget","sStale","sPin","sNotify","sArr","sFin"].forEach(id=>{const el=$("#"+id);if(el)el.addEventListener("input",dirty);if(el)el.addEventListener("change",dirty);});
    document.querySelectorAll("[data-msel]").forEach(el=>el.onchange=()=>{const id=el.dataset.msel;if(id.startsWith("fm_"))S.cfg.fields.modes[id.slice(3)]=el.value;else S.cfg.fields.custom[+id.slice(3)].mode=el.value;dirty();});
    document.querySelectorAll("[data-cfo]").forEach(el=>el.oninput=()=>{S.cfg.fields.custom[+el.dataset.cfo].options=el.value.split(/[,،]/).map(x=>x.trim()).filter(Boolean);dirty();});
    document.querySelectorAll("[data-cfdel]").forEach(b=>b.onclick=()=>{readGeneral();S.cfg.fields.custom.splice(+b.dataset.cfdel,1);S.cfgDirty=true;render();});
    const nt=$("#nfType");if(nt)nt.onchange=()=>{$("#nfOptsW").hidden=!["choice","multi"].includes(nt.value);};
    const na=$("#nfAdd");if(na)na.onclick=()=>{const l=$("#nfLabel").value.trim();if(!l){toast("اكتب اسم الحقل الأول");return;}const ty=nt.value;
      const op=$("#nfOpts").value.split(/[,،]/).map(x=>x.trim()).filter(Boolean);if(["choice","multi"].includes(ty)&&op.length<2){toast("اكتب اختيارين على الأقل");return;}
      readGeneral();S.cfg.fields.custom.push({id:"c"+Date.now().toString(36),label:l,type:ty,options:op,mode:$("#nfMode").value});S.cfgDirty=true;render();toast("اتضاف — متنساش تحفظ");};
    document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{readGeneral();const [k,i]=b.dataset.del.split("|");S.cfg.lists[k].splice(+i,1);S.cfgDirty=true;render();});
    document.querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>{readGeneral();const [k,i]=b.dataset.up.split("|");const a=S.cfg.lists[k];const j=+i;if(j>0)[a[j-1],a[j]]=[a[j],a[j-1]];S.cfgDirty=true;render();});
    document.querySelectorAll("[data-add]").forEach(b=>{const k=b.dataset.add;const inp=$("#add_"+k);const add=()=>{const v=inp.value.trim();if(!v)return;readGeneral();if(!S.cfg.lists[k].includes(v))S.cfg.lists[k].push(v);S.cfgDirty=true;render();const n=$("#add_"+k);if(n)n.focus();};b.onclick=add;inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();add();}};});
    const sv=$("#cfgSave");sv.onclick=async()=>{readGeneral();sv.disabled=true;$("#cfgMsg").textContent="جارِ الحفظ…";
      try{const c=await call("apiSaveSettings",S.mgrPin,S.cfg);S.mgrPin=c.managerPin;store.set("mgr",c.managerPin);S.cfg=c;S.cfgDirty=false;LISTS=c.lists;FIELDS=c.fields;S.init.appName=c.appName;$("#appName").textContent=c.appName;S.dash=await call("apiDashboard",S.mgrPin);render();toast("تم الحفظ ✓ والتطبيق اتحدّث");}
      catch(ex){$("#cfgMsg").textContent=ex.message;sv.disabled=false;}};
  }

  const ropt=()=>({person:S.rp.person,withTeam:S.rp.withTeam,from:rptRange(),to:Date.now()+864e5});
  const rpP=$("#rpPerson");if(rpP)rpP.onchange=()=>{S.rp.person=rpP.value;S.rptTo="";render();};
  document.querySelectorAll("[data-rpt]").forEach(b=>b.onclick=()=>{S.rp.withTeam=b.dataset.rpt==="1";render();});
  document.querySelectorAll("[data-rpp]").forEach(b=>b.onclick=()=>{S.rp.period=b.dataset.rpp;render();});
  const rb=$("#rptBtn");if(rb)rb.onclick=async()=>{rb.disabled=true;const m=$("#rptMsg");m.textContent="جارِ تجهيز التقرير… (ثواني)";
    try{S.rpt=await call("apiReport",S.mgrPin,ropt());m.innerHTML=`<a class="btn g" href="${esc(S.rpt.url)}" target="_blank">✓ افتح التقرير ↗</a>`;}catch(ex){m.textContent=ex.message;}rb.disabled=false;};
  const rs=$("#rptSend");if(rs)rs.onclick=async()=>{const to=$("#rptTo").value.trim();S.rptTo=to;const m=$("#rptMsg");if(!to){m.textContent="اكتب الإيميل الأول";return;}
    rs.disabled=true;m.textContent="جارِ الإرسال…";try{const r=await call("apiSendReport",S.mgrPin,ropt(),to);m.textContent="✓ اتبعت لـ "+r.sent+" إيميل";}catch(ex){m.textContent=ex.message;}rs.disabled=false;};
  const tr=document.querySelector(".tree .tn");if(tr){tr.scrollIntoView({inline:"center",block:"nearest"});window.scrollTo(0,0);}
  const ap=$("#addP");if(ap)ap.onclick=()=>{S.edit={isNew:true,p:{role:"مندوب"}};render();window.scrollTo(0,0);};
  document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{const p=S.dash.reps.find(r=>r.id===b.dataset.edit);S.edit={isNew:false,p};render();window.scrollTo(0,0);});
  const pf=$("#pf");
  if(pf){$("#pfClose").onclick=()=>{S.edit=null;render();};
    const reload=async()=>{S.dash=await call("apiDashboard",S.mgrPin);};
    pf.onsubmit=async e=>{e.preventDefault();const er=$("#pfErr");er.hidden=true;const d={name:$("#pName").value.trim(),role:$("#pRole").value,manager:$("#pMgr").value,position:$("#pPos").value.trim(),email:$("#pEmail").value.trim(),area:$("#pArea").value.trim()};
      if(!d.name){er.textContent="اكتب الاسم";er.hidden=false;return;}const sb=$("#pfSave");sb.disabled=true;
      try{if(S.edit.isNew){const r=await call("apiAddPerson",S.mgrPin,d);await reload();S.edit={isNew:false,p:S.dash.reps.find(x=>x.id===r.id)||d};render();$("#pfMsg").innerHTML=`<div class="banner b-ok">✓ اتضاف. الرقم السري بتاعه: <b dir="ltr">${esc(r.pin)}</b></div>`;}
        else{await call("apiUpdatePerson",S.mgrPin,S.edit.p.id,d);await reload();S.edit=null;render();toast("تم الحفظ ✓");}}
      catch(ex){er.textContent=ex.message;er.hidden=false;sb.disabled=false;}};
    const pp=$("#pfPin");if(pp)pp.onclick=async()=>{try{const p=await call("apiGetPin",S.mgrPin,S.edit.p.id);$("#pfMsg").innerHTML=`<div class="banner b-info">الرقم السري: <b dir="ltr">${esc(p)}</b></div>`;}catch(ex){toast(ex.message);}};
    const po=$("#pfOff");if(po)po.onclick=async()=>{if(po.dataset.a!=="1"){po.dataset.a="1";po.textContent="اضغط تاني للتأكيد";return;}po.disabled=true;
      try{await call("apiUpdatePerson",S.mgrPin,S.edit.p.id,{active:S.edit.p.active===false});await reload();S.edit=null;render();toast("تم ✓");}catch(ex){toast(ex.message);po.disabled=false;}};}
  const o=$("#fOut");if(o)o.onchange=()=>{S.f.outcome=o.value;render();};
  const rf=$("#refresh");if(rf)rf.onclick=async()=>{rf.disabled=true;try{S.dash=await call("apiDashboard",S.mgrPin);render();toast("تم التحديث");}catch(ex){toast(ex.message);rf.disabled=false;}};
}

(async()=>{
  if(false){
    $("#app").innerHTML=`<div class="card" style="max-width:520px;margin:20px auto"><h2 style="margin-bottom:8px">الملف ده مش بيشتغل لوحده</h2>
     <p class="muted" style="margin:0">لازم تفتح المنصة من رابط Apps Script اللي آخره <b dir="ltr">/exec</b> (بعد Deploy ← Web app)، مش من ملف Index.html نفسه.</p></div>`;
    return;
  }
  try{S.init=await call("apiInit");if(S.init.lists)LISTS=S.init.lists;if(S.init.fields)FIELDS=S.init.fields;if(S.init.appName){$("#appName").textContent=S.init.appName;document.title=S.init.appName+" — HMC Diagnostics";}if(S.init.logo){$("#logo").src=S.init.logo;$("#logo").style.display="block";$("#mark").style.display="none";}}catch(e){$("#app").innerHTML=`<div class="banner b-err">مقدرناش نحمّل المنصة: ${esc(e.message)}</div>`;return;}
  const saved=store.get("rep");
  if(saved){try{const st=await call("apiLogin",saved.id,saved.pin);S.rep=st.rep;S.pin=saved.pin;S.state=st;}catch(e){store.del("rep");}}
  const mp=store.get("mgr"); if(mp&&!S.rep){try{S.dash=await call("apiDashboard",mp);S.mgrPin=mp;S.view="mgr";}catch(e){store.del("mgr");}}
  render();
  setInterval(async()=>{if(S.view==="mgr"&&S.dash&&!document.hidden&&!S.edit&&S.mtab==="visits"){try{S.dash=await call("apiDashboard",S.mgrPin);render();}catch(e){}}},120000);
})();
</script>
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js");</script>
</body>
